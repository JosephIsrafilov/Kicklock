name: Build KickLock 0.4.0

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KICKLOCK_TEST_TARGETS: >-
    KickLockFastTests KickLockHostAcceptanceTests
    KickLockGuiAcceptanceTests KickLockMalformedStateTests

jobs:
  windows:
    name: Windows approved validation
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      FULL_VALIDATION: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build approved targets
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if "%FULL_VALIDATION%"=="true" (
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKICKLOCK_ENABLE_PLUGINVAL=ON
            cmake --build build --target KickLock_VST3 KickLock_AU KickLockFastTests KickLockHostAcceptanceTests KickLockGuiAcceptanceTests KickLockMalformedStateTests --parallel 4
          ) else (
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKICKLOCK_ENABLE_PLUGINVAL=OFF
            cmake --build build --target KickLock_VST3 KickLockFastTests KickLockHostAcceptanceTests KickLockGuiAcceptanceTests KickLockMalformedStateTests --parallel 4
          )

      - name: Run approved tests
        shell: pwsh
        run: |
          $targets = @(
            'KickLockFastTests.exe',
            'KickLockHostAcceptanceTests.exe',
            'KickLockGuiAcceptanceTests.exe',
            'KickLockMalformedStateTests.exe'
          )
          foreach ($target in $targets) {
            $path = Join-Path 'build/tests' $target
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing test executable: $path" }
            & $path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run pluginval strictness 10
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          ctest --test-dir build -R '^pluginval_vst3$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos:
    name: macOS approved validation
    runs-on: macos-14
    timeout-minutes: 35
    env:
      FULL_VALIDATION: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build approved targets
        run: |
          if [[ "$FULL_VALIDATION" == "true" ]]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DKICKLOCK_ENABLE_PLUGINVAL=ON
            cmake --build build --target KickLock_VST3 KickLockFastTests KickLockHostAcceptanceTests KickLockGuiAcceptanceTests KickLockMalformedStateTests --parallel 4
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DKICKLOCK_ENABLE_PLUGINVAL=OFF
            cmake --build build --target KickLock_VST3 KickLockFastTests KickLockHostAcceptanceTests KickLockGuiAcceptanceTests KickLockMalformedStateTests --parallel 4
          fi

      - name: Run approved tests
        run: |
          for test_binary in \
            build/tests/KickLockFastTests \
            build/tests/KickLockHostAcceptanceTests \
            build/tests/KickLockGuiAcceptanceTests \
            build/tests/KickLockMalformedStateTests; do
            test -x "$test_binary"
            "$test_binary"
          done

      - name: Run pluginval strictness 10
        if: github.event_name != 'pull_request'
        run: ctest --test-dir build -R '^pluginval_vst3$' --output-on-failure

      - name: Run macOS auval
        if: github.event_name != 'pull_request'
        run: |
          au="build/KickLock_artefacts/Release/AU/KickLock.component"
          test -d "$au"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/KickLock.component"
          ditto "$au" "$HOME/Library/Audio/Plug-Ins/Components/KickLock.component"
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aufx Klck Oskl
